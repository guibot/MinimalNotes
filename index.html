<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashNote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0f0f0f;
      color: #c8c8c8;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      overflow: hidden;
      user-select: none;
    }

    #titlebar {
      height: 32px;
      display: flex;
      align-items: center;
      padding: 0 10px 0 14px;
      background: #0f0f0f;
      -webkit-app-region: drag;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
      position: relative;
    }

    #app-name {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #444;
      text-transform: lowercase;
    }

    #titlebar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      -webkit-app-region: no-drag;
    }

    #pin-btn {
      font-size: 10px;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid #2a2a2a;
      background: transparent;
      color: #555;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      text-transform: lowercase;
    }

    #pin-btn:hover { color: #888; border-color: #444; }
    #pin-btn.active { color: #a0c4ff; border-color: #2a4a7f; background: #0d1a2e; }

    .win-btn {
      width: 26px;
      height: 20px;
      border: none;
      border-radius: 3px;
      background: transparent;
      color: #444;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, color 0.1s;
    }
    .win-btn:hover { background: #1e1e1e; color: #aaa; }
    #close-btn:hover { background: #5a1010; color: #ff8080; }

    #tabbar {
      height: 26px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      background: #0f0f0f;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid transparent;
      color: #555;
      font-size: 11px;
      cursor: pointer;
      background: transparent;
    }

    .tab:hover { color: #888; border-color: #2a2a2a; }
    .tab.active { color: #a0c4ff; border-color: #2a4a7f; background: #0d1a2e; }

    .tab-close {
      font-size: 11px;
      line-height: 1;
      color: #444;
      padding: 0 2px;
      border-radius: 2px;
    }

    .tab-close:hover { color: #ff8080; background: #5a1010; }

    #tabbar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #expand-btn, #add-tab-btn {
      width: 18px;
      height: 18px;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      background: transparent;
      color: #555;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #expand-btn:hover, #add-tab-btn:hover { color: #888; border-color: #444; }
    #expand-btn.active { color: #a0c4ff; border-color: #2a4a7f; background: #0d1a2e; }
    #add-tab-btn:disabled { opacity: 0.3; cursor: default; }
    #add-tab-btn:disabled:hover { color: #555; border-color: #2a2a2a; }

    #editor-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 32px - 26px);
      position: relative;
    }

    #note {
      flex: 1;
      width: 100%;
      resize: none;
      border: none;
      outline: none;
      background: #0f0f0f;
      color: #c8c8c8;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.65;
      padding: 16px 18px;
      caret-color: #a0c4ff;
      -webkit-app-region: no-drag;
      user-select: text;
    }

    #note::placeholder { color: #2a2a2a; }
    #note::-webkit-scrollbar { width: 6px; }
    #note::-webkit-scrollbar-track { background: transparent; }
    #note::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
    #note::-webkit-scrollbar-thumb:hover { background: #333; }

    #split-container {
      display: none;
      flex: 1;
      overflow: hidden;
    }

    .split-col {
      display: flex;
      flex-direction: column;
      min-width: 80px;
      height: 100%;
    }

    .split-col textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border: none;
      outline: none;
      background: #0f0f0f;
      color: #c8c8c8;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.65;
      padding: 16px 18px;
      caret-color: #a0c4ff;
      -webkit-app-region: no-drag;
      user-select: text;
    }

    .split-col textarea::placeholder { color: #2a2a2a; }

    .split-resizer {
      width: 4px;
      flex-shrink: 0;
      cursor: col-resize;
      background: #1e1e1e;
    }

    .split-resizer:hover, .split-resizer.dragging { background: #444; }

    #status {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 10px;
      color: #333;
      letter-spacing: 0.04em;
      pointer-events: none;
      transition: color 0.3s;
    }

    #status.saving { color: #555; }
    #status.saved  { color: #2d6a2d; }
    #status.error  { color: #8b2020; }
  </style>
</head>
<body>
  <div id="titlebar">
    <span id="app-name">FlashNote</span>
    <div id="titlebar-right">
      <button id="pin-btn" title="Toggle always on top">pin</button>
      <button class="win-btn" id="min-btn" title="Minimize">&#8211;</button>
      <button class="win-btn" id="max-btn" title="Maximize">&#9633;</button>
      <button class="win-btn" id="close-btn" title="Close">&#10005;</button>
    </div>
  </div>

  <div id="tabbar">
    <div id="tabbar-actions">
      <button id="expand-btn" title="Toggle split view">&#8596;</button>
      <button id="add-tab-btn" title="New tab">+</button>
    </div>
  </div>

  <div id="editor-wrap">
    <textarea id="note" placeholder="start typing…" spellcheck="false"></textarea>
    <div id="split-container"></div>
    <div id="status"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
